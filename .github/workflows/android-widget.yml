name: Android widget

# Builds the small Remindo Widget app (android/) and publishes the APK as the
# "widget-latest" release, which More → Home-screen widget links to.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-widget.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-widget.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk remindo-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: remindo-widget
          path: remindo-widget.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-latest
          name: Remindo Widget (Android)
          body: |
            Home-screen widget for Remindo. On your phone: download remindo-widget.apk, open it,
            allow "install unknown apps" for your browser if asked, then open Remindo → More →
            Home-screen widget → Connect it.
          files: remindo-widget.apk
          make_latest: false
